services:
  beacon-facade:
    image: fairdatasystems/beaconfacade:2026-11-08@sha256:d0926434abc87d236e86e682a3c9d6df00553a6e20b4ea3dc41d1cb306cf1c48
    restart: always
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    # No cap_add needed -- this Dockerfile never runs as root at all (no chown-then-gosu step: no
    # volumes are mounted, so there's nothing to chown), it starts directly as the non-root `beacon`
    # user baked into the image. Same rationale as ../shallot-facade/docker-compose.yml,
    # this facade's sibling.
    mem_limit: 512m
    cpus: 1
    ports:
      - "${BEACON_PORT:-4567}:${BEACON_PORT:-4567}"
    env_file:
      - .env
    environment:
      - RACK_ENV=production
      - APP_ENV=production     # both for redundancy, matching Severance's own compose files
    # Lets BEACON_SEVERANCE_URL point at host.docker.internal for same-host testing against a
    # Severance External that isn't itself dockerized on this same compose network -- matching
    # Severance's internal/docker-compose.yml's identical convention and rationale.
    extra_hosts:
      - "host.docker.internal:host-gateway"
